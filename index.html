<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Frontend Mentor Challenges</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="./favicon.png" />
  </head>
  <body>
    <h1>Frontend Mentor Challenges</h1>

    <main class="gallery-grid">
      <!-- Challenge Card 1 -->
      <a href="./qr-code-component/" class="card">
        <div class="card-media">
          <img
            src="./qr-code-component/preview.jpg"
            alt="QR Code Preview"
            class="card-img"
          />
        </div>
        <div class="card-body">
          <div class="card-header">
            <h2>QR Code Component</h2>
          </div>
          <p>A responsive QR code card component.</p>
        </div>
      </a>

      <!-- Challenge Card 2 -->
      <a href="./blog-preview-card/" class="card">
        <div class="card-media">
          <img
            src="./blog-preview-card/preview.jpg"
            alt="Blog Preview Card Preview"
            class="card-img"
          />
        </div>
        <div class="card-body">
          <div class="card-header">
            <h2>Blog Preview Card</h2>
          </div>
          <p>A clean blog post preview card layout.</p>
        </div>
      </a>

      <!-- Challenge Card 1 -->
      <a href="./social-links-profile-main/" class="card">
        <div class="card-media">
          <img
            src="./social-links-profile-main/preview.jpg"
            alt="Social Links Card"
            class="card-img"
          />
        </div>
        <div class="card-body">
          <div class="card-header">
            <h2>Social Links Card Component</h2>
          </div>
          <p>Aesthetic Social Links Card view</p>
        </div>
      </a>
    </main>
  </body>
</html>
